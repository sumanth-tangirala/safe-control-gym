[tool.poetry]
name = "safe-control-gym"
version = "2.0.0"
description = "PyBullet CartPole and Quadrotor environments—with CasADi symbolic a priori dynamics—for learning-based control and RL"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "^3.10"
munch = "^4.0"
PyYAML = "^6.0"
imageio = "^2.37"
dict-deep = "^4.1"
scikit-optimize = "^0.10"
scikit-learn = "^1.7"
gymnasium = "^1.3"
torch = "^2.8"
stable-baselines3 = "^2.9"
gpytorch = "^1.14"
tensorboard = "^2.20"
casadi = "^3.7"
pybullet = "^3.2"
numpy = "^2.2"
cvxpy = "^1.7"
pycddlib = "^2.1"
pytope = "^0.0.4"
Mosek = "^11.0"
termcolor = "^3.1"
pytest = "^8.4"
pre-commit = "^4.3"
optuna = "^3.0"
optuna-dashboard = "^0.9"
mysql-connector-python = "8.0.33"
pymysql = "1.1.1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Tests that spawn a real training run are opt-in.
#
# Four files launch `train_sb3` as a subprocess (test_train_sb3, test_eval_policy,
# test_sparse_reward, test_export_sb3_pendulum). Even at total_timesteps=256 they
# cost minutes and saturate every core on the box, which makes `pytest tests/`
# unusable as a quick check during development.
#
# They still matter -- they are the only coverage of the trainer and of the
# eval_policy acceptance bar -- so run them deliberately:
#     pytest -m training
# or everything at once:
#     pytest -m 'training or not training'
addopts = "-m 'not training'"
markers = [
    "training: spawns a real training subprocess; deselected by default (run with -m training)",
]
