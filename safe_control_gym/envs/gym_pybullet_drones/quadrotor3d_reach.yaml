# Composite (system, task) id [REACH]: 3D quadrotor, stabilization.
#
# A copy of quadrotor.yaml with the system and task axes pinned. Building this id
# and building `quadrotor` with the same overrides must produce the same
# environment -- tests/test_envs/test_composite_env_ids.py asserts it -- so this
# file tracks its base and must not acquire training-specific values. Put those
# in configs/sb3/ instead.

# Simulation options
ctrl_freq: 60
pyb_freq: 240
physics: pyb
gui: False
quad_type: 3
normalized_rl_action_space: False
episode_len_sec: 5
# State initialization
init_state: null
randomized_init: False
init_state_randomization_info: null
# Randomization
inertial_prop: null
randomized_inertial_prop: False
inertial_prop_randomization_info: null
# Task semantics: reach. terminate_on_goal True ends the episode the moment the
# goal ball is entered -- touch it and you are done, no holding required.
#
# This is what Task.STABILIZATION did unconditionally before the flag existed,
# and therefore how EVERY shipped dataset was collected. A reach run is the one
# directly comparable to roa_labels.txt and eval_states.txt.
terminate_on_goal: True

# Task
task: stabilization
# THREE_D needs a 3-element stabilization_goal; the class default
# (`TASK_INFO['stabilization_goal'] = [0, 1]`) is 2D-only and raises IndexError
# on X_GOAL construction. task_info REPLACES the whole dict rather than merging,
# so every other key of Quadrotor.TASK_INFO is restated verbatim below.
#
# stabilization_goal_tolerance stays at the class default 0.05, deliberately.
# generate_quadrotor_3d_trajectories.py:483 drops it to 0.0 under
# --invariant_terminal_sets, because there success is ellipsoid membership and
# the goal ball must never fire. Evaluation here uses info['goal_reached'], so a
# 0.0 tolerance would make success_rate identically zero.
task_info:
  stabilization_goal: [0, 0, 1]
  stabilization_goal_tolerance: 0.05
  trajectory_type: circle
  num_cycles: 1
  trajectory_plane: zx
  trajectory_position_offset: [0.5, 0]
  trajectory_scale: -0.5
  proj_point: [0, 0, 0.5]
  proj_normal: [0, 1, 1]
cost: rl_reward
# Disturbances
disturbances: null
adversary_disturbance: null
adversary_disturbance_offset: 0.0
adversary_disturbance_scale: 0.01
# Constraints
constraints: null
done_on_violation: False
use_constraint_penalty: False
constraint_penalty: -1
# Misc
verbose: False
# RL Hyper-parameters
norm_act_scale: 0.1
obs_goal_horizon: 0
rew_state_weight: 1.0
rew_act_weight: 0.0001
rew_exponential: True
done_on_out_of_bound: True
