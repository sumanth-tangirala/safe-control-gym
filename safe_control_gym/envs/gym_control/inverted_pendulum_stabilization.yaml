# Composite (system, task) id: inverted pendulum, stabilization.
#
# A copy of inverted_pendulum.yaml with the task axis pinned. Building this id
# and building `inverted_pendulum` with the same overrides must produce the same
# environment -- tests/test_envs/test_composite_env_ids.py asserts it -- so this
# file tracks its base and must not acquire training-specific values. Put those
# in configs/sb3/ instead.

# Simulation options
# pyb_freq == ctrl_freq == 100 gives the source system's dt = 0.01 explicit-Euler step.
ctrl_freq: 100
pyb_freq: 100
gui: False
normalized_rl_action_space: False
episode_len_sec: 10
# State initialization
init_state: null
randomized_init: True
init_state_randomization_info: null
# Randomization
inertial_prop: null
randomized_inertial_prop: False
inertial_prop_randomization_info: null
# Task
task: stabilization
task_info: null
cost: quadratic
# Disturbances
disturbances: null
adversary_disturbance: null
adversary_disturbance_offset: 0.0
adversary_disturbance_scale: 0.01
# Constraints
constraints: null
done_on_violation: False
use_constraint_penalty: False
constraint_penalty: -1
# Misc
verbose: False
# Physical parameters (defaults match the source inverted_pendulum system)
gravity: 9.81
pendulum_mass: 0.15
pendulum_length: 0.5
damping: 0.1
u_sat: 0.6371781908344007
theta_dot_max: 6.283185307179586
goal_threshold: 0.075
# Noise: null (deterministic), a preset name (e.g. truncated_gaussian_act_med),
# or a {type: ..., ...params} dict. See envs/gym_control/pendulum_noise.py.
noise: null
# Reward parameters
obs_goal_horizon: 0
rew_state_weight: 1.0
rew_act_weight: 0.0001
rew_exponential: True
