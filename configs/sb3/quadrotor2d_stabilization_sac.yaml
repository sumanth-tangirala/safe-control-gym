# SAC on the 2D quadrotor, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id quadrotor2d_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/quadrotor2d_stabilization_sac.yaml
#
# The initial-state range and the termination bounds both come from
# configs/collection/quadrotor2d_stabilization.yaml, transcribed from the shipped
# dataset's dataset_description.json. Training and evaluation read that one
# file, so the regime a policy learns in is the regime it is scored in.
#
# Deliberately NOT set here: init_state_randomization_info. Splitting the start
# range across two files is how the two silently diverge.
#
# Hyperparameters below are hand-written starting points. No search has been run.
#
# Note the collection regime is strict here: termination at |x_dot| > 1.0 m/s,
# where the env default allowed 30. Under random actions episodes last ~8 steps.
# That severity is the dataset's, and is much of why its success rate is 0.0802.

sb3_config:
  total_timesteps: 500000
  net_arch: [256, 256]
  save_freq: 50000
  eval_freq: 50000
  n_eval_episodes: 10
  collection_bounds: configs/collection/quadrotor2d_stabilization.yaml
