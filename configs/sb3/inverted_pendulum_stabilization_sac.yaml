# SAC on the inverted pendulum, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id inverted_pendulum_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/inverted_pendulum_stabilization_sac.yaml --use_gpu
#
# Training-specific values live here, never in the env yaml: a composite id's
# yaml must stay a faithful copy of its base so runs under the two ids remain
# comparable (tests/test_envs/test_composite_env_ids.py).

task_config:
  # rl_reward, not the env default `quadratic`. The quadratic branch returns a
  # symbolic LQR loss, which is a cost to minimise rather than a reward to
  # maximise; SAC needs the exponential shaped reward.
  cost: rl_reward

sb3_config:
  total_timesteps: 200000
  net_arch: [256, 256]
  save_freq: 20000
  eval_freq: 20000
  n_eval_episodes: 10
  # The shipped pendulum_rl policies observe [cos(theta), sin(theta),
  # theta_dot/theta_dot_max] and hold each action for 4 steps. Matching that
  # here is what makes a newly trained policy loadable by the same controller.
  angle_obs:
    angle_index: 0
    rate_index: 1
    rate_max: 6.283185307179586
  action_repeat: 4
