# SAC on the inverted pendulum, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id inverted_pendulum_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/inverted_pendulum_stabilization_sac.yaml
#
# The initial-state range and the termination bounds both come from
# configs/collection/inverted_pendulum_stabilization.yaml, transcribed from the shipped
# dataset's dataset_description.json. Training and evaluation read that one
# file, so the regime a policy learns in is the regime it is scored in.
#
# Deliberately NOT set here: init_state_randomization_info. Splitting the start
# range across two files is how the two silently diverge.
#
# Hyperparameters below are hand-written starting points. No search has been run.
#
# angle_obs and action_repeat mirror the shipped pendulum_rl policies, so a
# newly trained policy stays loadable by the same controller.

task_config:
  # rl_reward, not the env default `quadratic`: the quadratic branch returns a
  # symbolic LQR loss, a cost to minimise rather than a reward to maximise.
  cost: rl_reward

sb3_config:
  total_timesteps: 200000
  net_arch: [256, 256]
  save_freq: 20000
  eval_freq: 20000
  n_eval_episodes: 10
  angle_obs:
    angle_index: 0
    rate_index: 1
    rate_max: 6.283185307179586
  action_repeat: 4
  collection_bounds: configs/collection/inverted_pendulum_stabilization.yaml
