# SAC on the 3D quadrotor, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id quadrotor3d_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/quadrotor3d_stabilization_sac.yaml --use_gpu
#
# Training-specific values live here, never in the env yaml: a composite id's
# yaml must stay a faithful copy of its base so runs under the two ids remain
# comparable (tests/test_envs/test_composite_env_ids.py).
#
# The system most likely not to converge: 12 state dimensions, 4 actions,
# PyBullet dynamics, and no prior evidence that this reward stabilises it at
# all. Longer horizon and a wider network than the others for that reason, but
# these are guesses. A non-converging run here is a result to report, not a
# config to keep tuning silently.

task_config:
  # The env yaml ships randomized_init: False, which would give SAC the same
  # initial state every episode and a policy that generalises nowhere. The env
  # yaml is left alone; the training run asks for randomisation instead.
  randomized_init: True

sb3_config:
  total_timesteps: 1000000
  net_arch: [400, 300]
  save_freq: 100000
  eval_freq: 50000
  n_eval_episodes: 10
