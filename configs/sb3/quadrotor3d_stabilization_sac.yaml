# SAC on quadrotor3d, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id quadrotor3d_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/quadrotor3d_stabilization_sac.yaml
#
# Initial-state range and termination bounds both come from
# configs/collection/quadrotor3d.yaml, transcribed from the shipped dataset's
# dataset_description.json. Training and evaluation read that one file, so the
# regime a policy learns in is the regime it is scored in.
#
# cost: sparse, deliberately. Under the dense rl_reward, reaching the goal ends
# the episode and forfeits every remaining step, so success is irrational:
# measured on cartpole, tightening the terminal error to the goal ball was worth
# +4.46 return while the termination it triggers cost -181.2. SAC learned the
# correct policy for that reward -- hover just outside the ball, 3.8x the LQR
# return at 0.000 success. Sparse makes the goal the only positive term.
#
# Hyperparameters are hand-written starting points. No search has been run.

task_config:
  cost: sparse
  sparse_goal_reward: 1.0
  sparse_oob_reward: -1.0
  sparse_step_reward: -0.01

sb3_config:
  total_timesteps: 1000000
  net_arch: [400, 300]
  save_freq: 100000
  eval_freq: 100000
  n_eval_episodes: 10
  # SubprocVecEnv when > 1: env stepping is the bottleneck here, not the
  # MLP. Evaluation envs stay unvectorised.
  n_envs: 4
  collection_bounds: configs/collection/quadrotor3d.yaml
