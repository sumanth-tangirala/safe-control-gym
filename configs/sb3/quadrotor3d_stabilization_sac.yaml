# SAC on the 3D quadrotor, stabilization.
#
#   python -m safe_control_gym.experiments.train_sb3 \
#       --env_id quadrotor3d_stabilization --algo sac --output_dir logs \
#       --overrides configs/sb3/quadrotor3d_stabilization_sac.yaml
#
# The initial-state range and the termination bounds both come from
# configs/collection/quadrotor3d_stabilization.yaml, transcribed from the shipped
# dataset's dataset_description.json. Training and evaluation read that one
# file, so the regime a policy learns in is the regime it is scored in.
#
# Deliberately NOT set here: init_state_randomization_info. Splitting the start
# range across two files is how the two silently diverge.
#
# Hyperparameters below are hand-written starting points. No search has been run.
#
# The system most likely not to converge: 12 state dimensions, 4 actions, and
# a collection regime spanning all orientations with body rates to +/-24 rad/s.
# A non-converging run here is a result to report, not a config to keep tuning.

sb3_config:
  total_timesteps: 1000000
  net_arch: [400, 300]
  save_freq: 100000
  eval_freq: 50000
  n_eval_episodes: 10
  collection_bounds: configs/collection/quadrotor3d_stabilization.yaml
