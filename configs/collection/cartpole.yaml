# The COLLECTION regime for the cartpole: the system, killed where the shipped
# dataset killed.
#
# Read by BOTH training (sb3_config.collection_bounds) and evaluation
# (--eval_bounds). The plant, start region, observation contract and curriculum
# live in configs/system/cartpole.yaml; this file adds only the termination box
# the dataset used and the reference numbers a run is compared against.
#
# Source: DATA_ROOT/deterministic/cartpole_pybullet/dataset_description.json,
# where initial_state_bounds and termination_thresholds are identical.

extends: ../system/cartpole.yaml

# Corrects the env defaults in BOTH directions:
#
#   x        default 2.4     -> 6.0    far too tight; collection samples +/-6
#   theta    default pi/2    -> inf    far too tight; over half of +/-pi died
#   x_dot    default 20      -> 5.0    too loose; the dataset kills earlier
#   theta_dot default 20     -> 5.0    too loose
#
# Same assignments as generate_cartpole_trajectories.py:262-265.
env_attributes:
  x_threshold: 6.0
  x_dot_threshold: 5.0
  theta_threshold_radians: .inf
  theta_dot_threshold: 5.0

# 20887/116242 of eval_states.txt labelled 1, produced by lqr.
reference_success: 0.1797
reference_dataset: 'deterministic/cartpole_pybullet'

# STABILIZATION, not reach. This was previously recorded as `reach` on the
# reasoning that the shipped datasets predate terminate_on_goal. That is wrong:
# the dataset's own success rule is a hold, and reproducing it exactly requires
# treating it as one.
#
# Verified 2026-07-31 by replaying eval_states.txt under reference_run below:
# 1000 random states and a balanced 128-positive/128-negative split both matched
# the shipped label column with ZERO disagreements in either direction.
# Re-verified same day after the extends: refactor and the frequency sync, with
# the plant built from THIS file through load_collection_bounds: 596 states
# (340 random + 256 balanced), again zero disagreements.
#
# Measured, same day: for THIS reference LQR the hold rule and reach labelling
# (first entry into the 0.05 L2 ball, terminate_on_goal true) coincide --
# 556/556 sampled labels reproduce under either. Post-entry excursions peak
# ~5.4x the ball radius, still 20x inside the velocity kills, so entry always
# settles. That equivalence is a property of the controller, NOT the task: a
# reach-trained policy has untrained post-entry behaviour, so scoring against
# reference_success still requires the hold rule.
reference_task: stabilization

# --- The generation config that produces reference_success, verified ---
#
# Recorded because it is not recoverable from this repo. The shipped artifacts
# predate the current generator (trajectories 2025-10-21, roa_labels 2025-11-08,
# the ctrl_freq logic in generate_cartpole_trajectories.py:543-552 landed
# 2025-12-19), and dataset_description.json was written 2026-03-04 -- so neither
# source alone describes the run. These values are from that description and are
# confirmed by exact label reproduction.
#
# control_bound is the one that matters and the one most easily guessed wrong:
# CartPole's own action_scale default is 10.0 N (cartpole.py:138), and at 10 N
# the replay agrees with only 93% of labels -- 6.6% of states are labelled
# success but cannot be reached, ~0% the other way. That one-directional
# signature is force starvation, and it is easy to misread as too short a
# horizon. The dataset used 2000 N, 200x the env default.
#
# reference_run below is documentation: nothing reads it. The subset that must
# actually reach the env lives in configs/system/cartpole.yaml's
# task_config_overrides, which IS consumed -- keep the two in sync by hand.
reference_run:
  controller: lqr
  q_lqr: [1, 1, 1, 1]
  r_lqr: [0.1]
  discrete_dynamics: true
  control_bound: 2000.0     # N; action_scale. NOT the env default of 10.0
  ctrl_freq: 100            # Hz
  pyb_freq: 5000            # Hz -- 50 physics substeps per control step
  max_steps: 1000           # 10 s at 100 Hz
  episode_len_sec: 10
  terminate_on_goal: false  # success is a hold, so the episode must be allowed to run
  obs_wrap_angle: true
  randomized_init: false
  x_dot_limit: .inf         # no velocity CLIPPING; the thresholds above terminate instead
  theta_dot_limit: .inf
  # Success: every channel inside tolerance simultaneously, held 10 consecutive
  # control steps (0.1 s). A per-channel box, not an L2 ball -- and x is 5x
  # tighter than the rest.
  success_tolerance:
    x: 0.01
    x_dot: 0.05
    theta: 0.05             # on the WRAPPED angle
    theta_dot: 0.05
  success_hold_steps: 10
