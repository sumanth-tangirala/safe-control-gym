# The collection regime for the 2D quadrotor.
#
# Read by BOTH training (sb3_config.collection_bounds) and evaluation
# (--eval_bounds).
#
# Source: DATA_ROOT/deterministic/quadrotor2D_rl/dataset_description.json.
#
# No termination overrides needed: this box already fits inside the env's
# state_space on every dimension it checks, and quadrotor.py masks the angle
# indices out of its out_of_bounds test as periodic variables, so theta never
# terminates however far it swings.
#
#   x        +/-1.0   inside +/-2.0
#   x_dot    +/-1.0   inside +/-30
#   z        0.1-1.5  inside -0.05-2.0
#   z_dot    +/-1.0   inside +/-30
#   theta    +/-pi    masked, never terminates
#   theta_dot +/-8.0  inside +/-8.727   <- the only tight margin
#
# state_space_bounds is nonetheless stated explicitly rather than left implicit.
# The alternative is relying on the env defaults happening to be wider, which is
# true today and is not a property anything enforces.

init_state_randomization_info:
  init_x: {distrib: 'uniform', low: -1.0, high: 1.0}
  init_x_dot: {distrib: 'uniform', low: -1.0, high: 1.0}
  init_z: {distrib: 'uniform', low: 0.1, high: 1.5}
  init_z_dot: {distrib: 'uniform', low: -1.0, high: 1.0}
  init_theta: {distrib: 'uniform', low: -3.141592653589793, high: 3.141592653589793}
  init_theta_dot: {distrib: 'uniform', low: -8.0, high: 8.0}

state_space_bounds:
  x: [-1.0, 1.0]
  x_dot: [-1.0, 1.0]
  z: [0.1, 1.5]
  z_dot: [-1.0, 1.0]
  theta: [-1.5707963267948966, 1.5707963267948966]
  theta_dot: [-8.0, 8.0]

# 39287/489789 of eval_states.txt labelled 1, produced by upstream's
# Safe Explorer PPO checkpoint. The lowest of any shipped dataset.
reference_success: 0.0802
reference_dataset: 'deterministic/quadrotor2D_rl'

# The reference above was measured under REACH semantics: every shipped dataset
# was collected before terminate_on_goal existed, when entering the goal ball
# ended the episode. A stabilization run, which must hold position there, is a
# strictly harder problem -- so comparing a stabilization success rate against
# this number is comparing two different tasks. eval_policy records both so the
# mismatch is visible rather than assumed away.
reference_task: reach

# --- Observation encoding: properties of the SYSTEM, not of a training run ---
#
# Declared here rather than in configs/sb3/ because which channel is an angle,
# and what the state layout is, are facts about the system. Restating them per
# training config invites two configs for one system to disagree.
#
# state_layout also names the channels that state_space_bounds addresses, so the
# layout is written once instead of being duplicated in train_sb3.
state_layout: [x, x_dot, z, z_dot, theta, theta_dot]

# No angle encoding: pitch here comes from an Euler convention bounded to
# +/-pi/2, so it never wraps and (cos, sin) would buy nothing.
angle_observation: null

# Map every channel from its state_space bounds onto [-1, 1]. The channels are
# badly commensurate otherwise -- widest/narrowest width ratio is 6.4 on
# cartpole, 11.4 on quadrotor2d and 16.6 on quadrotor3d, where body rates run to
# +/-24 against position at +/-1.8.
normalize_observation: true

# Present the policy with a symmetric [-1, 1] action space; the env denormalises
# to true units internally, so the dynamics are unchanged.
#
# Matters most for the quadrotors, whose raw action space is asymmetric and never
# negative -- [0.056, 0.297] N per motor pair on quadrotor2d, [0.028, 0.148] on
# quadrotor3d. SAC's policy is a tanh-squashed Gaussian centred at zero, so on
# that box its natural output sits at the bottom of the thrust range and a zero
# action means free fall rather than hover. SB3's check_env warns about exactly
# this. Normalised, zero maps to mid-thrust, which is near hover.
#
# The collectors are unaffected: they build the base env ids and never read this
# file.
normalized_rl_action_space: true

# Initial-state curriculum: start near the goal, widen as success is earned.
#
# Required, not optional. Measured over 300 random episodes, the number of steps
# landing inside the goal ball was 0 for cartpole, quadrotor2d and quadrotor3d --
# so under a sparse reward those runs see no positive signal at all and cannot
# learn. The pendulum managed 4 hits in 99,049 steps, which is barely better.
#
# fraction 0 is a point distribution at the goal, 1 is the full collection
# region above. Ranges contract about the GOAL value rather than the midpoint,
# so quadrotor2d's altitude starts at its 1.0 m goal rather than at 0.8 m.
#
# Advancement is driven by measured success rate, not by a step schedule: a
# schedule has to be guessed per system and is wrong in both directions.
curriculum:
  start: 0.005
  step: 0.15
  threshold: 0.5
