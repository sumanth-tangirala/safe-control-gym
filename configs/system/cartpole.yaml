# The cartpole SYSTEM: one plant, one observation contract, one start region.
#
# Facts about the dynamical system and how a policy sees it -- shared by every
# regime. The regime files (configs/collection/cartpole.yaml,
# configs/physical/cartpole.yaml) extend this file and add only what actually
# differs between them: the termination box, and any dataset reference numbers.
# `extends:` is resolved by load_collection_bounds (train_sb3.py), child keys
# win on conflict.

# --- Plant, matched EXACTLY to the reference dataset ---
#
# Constructor kwargs, merged into task_config by with_collection_init; they
# change the dynamical system, not just its start/stop box, so they cannot be
# applied after the env is built.
#
# action_scale 2000 N [user, 2026-07-31]: what the shipped labels were
# collected under, and 200x the env's 10 N default -- at 10 N a replay agrees
# with only 93% of the labels (force starvation, one-directional). NOT
# physically realisable: the URDF declares effort="1000.0" on slider_to_cart,
# so this is 2x the joint's own limit, ~185 g on a 1.1 kg system. If the
# programme ever moves authority, reference_success in the collection regime
# has to move with it.
#
# ctrl_freq/pyb_freq: the env defaults of 50/50 take ONE 20 ms PyBullet step
# per control step; the dataset integrated at 0.2 ms with a 10 ms hold
# (reference_run in configs/collection/cartpole.yaml).
task_config_overrides:
  action_scale: 2000.0
  ctrl_freq: 100
  pyb_freq: 5000

# --- Start region: the collection region, used by every regime ---
#
# Transcribed from the dataset's initial_state_bounds. The physical regime
# keeps the same box so success rates stay directly comparable across regimes.
init_state_randomization_info:
  init_x:
    distrib: uniform
    low: -6.0
    high: 6.0
  init_x_dot:
    distrib: uniform
    low: -5.0
    high: 5.0
  init_theta:
    distrib: uniform
    low: -3.141592653589793
    high: 3.141592653589793
  init_theta_dot:
    distrib: uniform
    low: -5.0
    high: 5.0

# --- Observation encoding: properties of the SYSTEM, not of a training run ---
#
# state_layout also names the channels that state_space_bounds addresses, so
# the layout is written once instead of being duplicated in train_sb3.
state_layout: [x, x_dot, theta, theta_dot]

# Encode this angle as (cos, sin) and scale its rate. The cartpole's theta is
# not wrapped -- measured over this region it reaches +/-4.4 during rollouts, so
# theta and theta - 2*pi are the same physical state shown to the policy as
# different observations, and it cannot generalise across revolutions.
angle_observation:
  angle: theta
  rate: theta_dot

# Map every channel from its state_space bounds onto [-1, 1]. The channels are
# badly commensurate otherwise -- widest/narrowest width ratio is 6.4 on
# cartpole.
normalize_observation: true

# Present the policy with a symmetric [-1, 1] action space; the env
# denormalises to true units internally, so the dynamics are unchanged.
normalized_rl_action_space: true

# Initial-state curriculum: start near the goal, widen as success is earned.
#
# Required, not optional. Measured over 300 random episodes, the number of
# steps landing inside the goal ball was 0 for cartpole -- under a sparse
# reward such runs see no positive signal at all and cannot learn.
#
# fraction 0 is a point distribution at the goal, 1 is the full start region
# above. Ranges contract about the GOAL value rather than the midpoint.
# Advancement is driven by measured success rate, not by a step schedule.
curriculum:
  start: 0.005
  step: 0.15
  threshold: 0.5
