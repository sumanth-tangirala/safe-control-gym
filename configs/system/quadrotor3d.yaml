# The 3D quadrotor SYSTEM: one plant, one observation contract, one start
# region.
#
# Facts about the dynamical system and how a policy sees it -- shared by every
# regime. The regime files (configs/collection/quadrotor3d.yaml,
# configs/physical/quadrotor3d.yaml) extend this file and add only what actually
# differs between them: the termination box (which for the quadrotors is
# `state_space_bounds`, not `env_attributes`) and any dataset reference numbers.
# `extends:` is resolved by load_collection_bounds (train_sb3.py), child keys
# win on conflict.

# --- Plant, matched to the reference dataset as closely as a constructor can ---
#
# Constructor kwargs, merged into task_config by with_collection_init; they
# change the dynamical system, not just its start/stop box, so they cannot be
# applied after the env is built.
#
# ctrl_freq/pyb_freq: the env defaults of 60/240 take four 4.2 ms PyBullet steps
# per 16.7 ms control step. The dataset integrated at 0.2 ms with a 10 ms hold
# -- 50 substeps -- matching what generate_quadrotor_3d_trajectories.py computes
# and what dataset_description.json records.
#
# task_info carries the dataset's goal and its 0.05 m success radius. Note this
# is the env's OWN default tolerance, unlike quadrotor2d where the dataset
# widened it to 0.2 -- but it is pinned here anyway rather than inherited,
# because benchmark_env.py:170 assigns TASK_INFO WHOLESALE rather than merging,
# so a partial dict would drop `stabilization_goal` entirely. The same trap
# applies as on quadrotor2d: a trajectory-tracking task built from this file
# would KeyError on the trajectory_* keys.
#
# episode_len_sec 10 = 1000 control steps, DELIBERATELY SHORTER than the
# dataset's own horizon and provably equivalent on the data. The collector ran
# episode_len_sec 1000 (max_steps 100000, 5 million physics steps per episode),
# which never came close to binding: the longest shipped trajectory is 636
# states. 1000 steps clears that by 1.6x while leaving a training episode
# finite. reference_run records the dataset's nominal 100000 and
# tests/test_envs/test_regime_configs.py asserts the ordering
# 636 < plant horizon <= reference horizon, so the shortening cannot silently
# become a truncation.
#
# NOT pinnable here, and the reason this system does not reproduce bit-exactly
# from a stock env: the shipped dataset ran at PyBullet's DEFAULT damping
# (linearDamping = angularDamping = 0.04), not at zero. See the loud note in
# configs/collection/quadrotor3d.yaml. Damping is a post-construction
# p.changeDynamics call that base_aviary re-applies on every reset, so no
# constructor kwarg can express it.
#
# The physical parameters (mass 0.027 kg, J = diag(1.4e-5, 1.4e-5, 2.17e-5),
# arm 0.0397 m, and the thrust coefficients that set the action bounds) come
# from assets/cf2x.urdf and are deliberately NOT restated as `inertial_prop`:
# that kwarg assigns self.MASS after loadURDF has already built the body, so
# pinning it there would desynchronise the simulated body from the model the
# goal and the symbolic dynamics are computed from. They are guarded by
# tests/test_envs/test_regime_configs.py instead.
#
# GRAVITY_ACC is 9.8, not 9.81 -- base_aviary.py:77 hardcodes it and
# dataset_description.json's 9.81 is wrong. It is not a constructor kwarg
# either; the test guards it.
task_config_overrides:
  ctrl_freq: 100
  pyb_freq: 5000
  episode_len_sec: 10
  task_info:
    stabilization_goal: [0, 0, 1]
    stabilization_goal_tolerance: 0.05

# --- Start region: the collection region, used by every regime ---
#
# Transcribed from the dataset's initial_state_bounds. As on quadrotor2d the
# start box and the collection kill box are the same box on the position and
# velocity channels, so a start state is never outside the region it is scored
# in.
#
# CAVEAT on attitude. The dataset stores orientation as a unit quaternion
# (qw, qx, qy, qz) covering all orientations, while this env is 12-D Euler
# (phi, theta, psi). Uniform sampling over Euler angles is NOT uniform over
# orientations, so the ranges below approximate the dataset's coverage rather
# than reproduce it. phi and theta are masked from the out_of_bounds test in any
# case, so this affects the start distribution only, not termination.
init_state_randomization_info:
  init_x: {distrib: 'uniform', low: -1.8, high: 1.8}
  init_x_dot: {distrib: 'uniform', low: -3.0, high: 3.0}
  init_y: {distrib: 'uniform', low: -1.8, high: 1.8}
  init_y_dot: {distrib: 'uniform', low: -3.0, high: 3.0}
  init_z: {distrib: 'uniform', low: 0.1, high: 3.0}
  init_z_dot: {distrib: 'uniform', low: -3.0, high: 3.0}
  init_phi: {distrib: 'uniform', low: -3.141592653589793, high: 3.141592653589793}
  init_theta: {distrib: 'uniform', low: -3.141592653589793, high: 3.141592653589793}
  init_psi: {distrib: 'uniform', low: -3.141592653589793, high: 3.141592653589793}
  # 13.856 = 24 / sqrt(3), NOT the dataset's 24, and the difference is a frame
  # mismatch in the env rather than a choice about coverage.
  #
  # reset() applies these through p.resetBaseVelocity, which takes a WORLD-frame
  # angular velocity, while the state reads back the BODY frame
  # (quadrotor.py:836, ang_v_body_frame = Rbo @ ang_v). With attitude randomised
  # over +/-pi the rotation mixes the components, so per-component world values
  # of 24 produce body-frame components up to sqrt(3)*24 ~ 41.6 -- measured 33.8,
  # against a termination bound of 24. 28.7% of episodes were therefore born out
  # of bounds and died on step one.
  #
  # ||omega|| is rotation-invariant, so bounding each world component by
  # 24/sqrt(3) guarantees every body-frame component stays within 24. Measured
  # after: body |pqr|max 19.5, dead-on-arrival down to 8.0%.
  #
  # The residual 8% is not this bug -- it is states sampled exactly at the
  # position and velocity bounds leaving them after one step, which is inherent
  # to sampling the whole non-terminating box and applies to the shipped dataset
  # too. The dataset carries the same frame mismatch, since the collectors set
  # initial states through this same reset path.
  init_p: {distrib: 'uniform', low: -13.8564064605510, high: 13.8564064605510}
  init_q: {distrib: 'uniform', low: -13.8564064605510, high: 13.8564064605510}
  init_r: {distrib: 'uniform', low: -13.8564064605510, high: 13.8564064605510}

# --- Observation encoding: properties of the SYSTEM, not of a training run ---
#
# state_layout also names the channels that state_space_bounds addresses, so the
# layout is written once instead of being duplicated in train_sb3.
state_layout: [x, x_dot, y, y_dot, z, z_dot, phi, theta, psi, p, q, r]

# No single-angle (cos, sin) encoding -- this system rotates in 3D, so the
# orientation is handled by rotation_observation below instead.
angle_observation: null

# Feed the policy the rotation matrix, not the Euler angles.
#
# Zhou et al. (2019) show no representation of SO(3) in four or fewer dimensions
# is continuous: there are always orientations where an arbitrarily small
# rotation makes the encoding jump. Euler is the worst case here -- it gimbal
# locks, it wraps, and this env's readback chart is singular at pitch +/-pi/2,
# which is why measured pitch topped out at 1.54 while roll ran to +/-pi.
# Quaternions avoid gimbal lock but double-cover, so q and -q are one rotation
# shown as two inputs.
#
# Nine entries rather than the minimal 6D form: 6D exists because PREDICTING a
# rotation needs a continuous parametrisation to regress into. As an input there
# is no such constraint, the three extra dimensions cost nothing, and there is no
# Gram-Schmidt step to get wrong. It is also what the quadrotor RL literature
# feeds.
#
# Observation goes 12 -> 18. Every entry of R is already in [-1, 1], so
# normalisation leaves them untouched.
rotation_observation:
  angles: [phi, theta, psi]

# Map every channel from its state_space bounds onto [-1, 1]. The channels are
# badly commensurate otherwise -- widest/narrowest width ratio is 6.4 on
# cartpole, 11.4 on quadrotor2d and 16.6 on quadrotor3d, where body rates run to
# +/-24 against position at +/-1.8.
normalize_observation: true

# Present the policy with a symmetric [-1, 1] action space; the env denormalises
# to true units internally, so the dynamics are unchanged.
#
# Matters most for the quadrotors, whose raw action space is asymmetric and never
# negative -- [0.056, 0.297] N per motor pair on quadrotor2d, [0.028, 0.148] on
# quadrotor3d. SAC's policy is a tanh-squashed Gaussian centred at zero, so on
# that box its natural output sits at the bottom of the thrust range and a zero
# action means free fall rather than hover. SB3's check_env warns about exactly
# this. Normalised, zero maps to mid-thrust, which is near hover.
#
# Unlike quadrotor2d, this is NOT what the reference dataset ran: its controller
# is LQR, which emits physical thrust, so the collector left the env default of
# False. A replay harness for this system must therefore DROP this key -- the
# same as cartpole and the pendulum, and the opposite of quadrotor2d. Leaving it
# True makes the env denormalise an already-physical command and multiply it by
# the thrust scale.
normalized_rl_action_space: true

# Initial-state curriculum: start near the goal, widen as success is earned.
#
# Required, not optional. Measured over 300 random episodes, the number of steps
# landing inside the goal ball was 0 for cartpole, quadrotor2d and quadrotor3d --
# so under a sparse reward those runs see no positive signal at all and cannot
# learn. The pendulum managed 4 hits in 99,049 steps, which is barely better.
#
# fraction 0 is a point distribution at the goal, 1 is the full start region
# above. Ranges contract about the GOAL value rather than the midpoint.
#
# Advancement is driven by measured success rate, not by a step schedule: a
# schedule has to be guessed per system and is wrong in both directions.
curriculum:
  start: 0.0
  step: 0.15
  threshold: 0.5
  # Even started exactly at the goal this system scores 0% under a random
  # policy at its true tolerance of 0.05 -- one random thrust leaves a
  # 0.05-radius ball in 12 dimensions. At 0.5 it scores 88%. Annealed back
  # down to 0.05 before the initial states widen.
  tolerance_start: 0.5
