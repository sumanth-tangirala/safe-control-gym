# The PHYSICAL regime for the inverted pendulum: terminate only on bounds with
# a physical origin.
#
# The plant, start region, observation contract and curriculum live in
# configs/system/inverted_pendulum.yaml; this file adds only the termination
# box -- and for this system there is nothing to add.
#
# The pendulum needs nothing dropped and nothing kept: a single continuous
# joint with no URDF limits, and inverted_pendulum._get_done has no
# out-of-bounds test at all. theta is wrapped to [-pi, pi] and theta_dot is
# CLIPPED at theta_dot_max rather than terminated, so no bound of ours was ever
# ending an episode. Contrast the other systems, where the invented bounds were
# doing most of the killing -- 61% of cartpole crashes came from a theta_dot
# limit on a joint the URDF declares unlimited, and 99% of quadrotor2d crashes
# from translational velocity limits on a free body that has no such limit.
#
# So this regime is behaviourally IDENTICAL to configs/collection/. The file
# exists for symmetry: eval_policy scores every run under both regimes, and a
# missing file would read as an un-migrated system rather than as a system with
# nothing to relax.
#
# This is the regime to TRAIN in. configs/collection/ stays as the datasets
# define it and carries the reference numbers.

extends: ../system/inverted_pendulum.yaml
